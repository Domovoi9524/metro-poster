<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#1b2430; --muted:#5d6b7c; --line:#d5dce4;
  --accent:#1f6feb; --accent-ink:#ffffff; --hl:#ff8a00; --ok:#1a8a3c; --warn:#b26a00;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12171d; --card:#1b222b; --ink:#e6ebf1; --muted:#9aa7b6; --line:#2f3a47; --accent:#4c8dff; --ok:#4cc46f; --warn:#e0a03a}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(340px,1fr);gap:14px;align-items:start;margin-bottom:12px}
.colL{position:sticky;top:12px}
.colL .card,.colR .card{margin-bottom:12px}
.colL .card{margin-bottom:0}
.colR{display:flex;flex-direction:column}
@media (max-width:1000px){.layout{grid-template-columns:1fr}.colL{position:static}#explain{order:-1}}
h1{font-size:22px;margin:0 0 2px}
.sub{margin:0 0 14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.board{background:#fff;border-radius:6px;overflow:hidden}
svg#scheme{width:100%;height:auto;display:block;max-height:calc(100vh - 190px);margin:0 auto}
@media (max-width:1000px){svg#scheme{max-height:46vh}}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
#stepNo{white-space:nowrap}
#stepHead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;flex:1;min-width:0;margin-left:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.done{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.dots i.cur{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
#stepper[hidden],#stepHead[hidden],#tip[hidden]{display:none}
#tip{position:fixed;z-index:20;pointer-events:none;background:#101826;color:#fff;border:1px solid #ffffff40;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.35;box-shadow:0 4px 14px #0006;max-width:260px}
#tip b{display:block;font-size:13px}
#tip .v{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
#tip .sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid #fff8;vertical-align:-1px;margin-right:6px}
#tip small{opacity:.75;display:block}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
.modes button{text-align:left;font-weight:600;padding:11px 14px}
.modes button small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.modes button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modes button.on small{color:#ffffffd0}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#explain h3{margin:0 0 6px;font-size:18px}
#explain p{margin:0}
#explain p.warn{color:var(--warn);font-weight:600;margin-top:6px}
#partCard h3{margin:0 0 4px;font-size:16px}
#partCard p{margin:0;color:var(--muted)}
#more[hidden],#partCard[hidden]{display:none}
.moreGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:820px){.moreGrid{grid-template-columns:1fr}}
.moreGrid .card{margin:0}
.ctl{margin-top:10px}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.ctl output{font-variant-numeric:tabular-nums;color:var(--accent)}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl small{color:var(--muted);display:block}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
table.vals{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.vals td{padding:4px 0;border-bottom:1px solid var(--line)}
.vals td:last-child{text-align:right;font-weight:700}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;font-size:14px}
ol.steps li{counter-increment:s;position:relative;padding:5px 8px 5px 32px;border-radius:8px;color:var(--muted)}
ol.steps li::before{content:counter(s);position:absolute;left:6px;top:5px;width:19px;height:19px;border-radius:50%;border:1px solid var(--line);text-align:center;font-size:12px;line-height:17px}
ol.steps li.act{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink)}
ol.steps li.act::before{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:2px}

const NS = "http://www.w3.org/2000/svg";

const MODES = {
  A:{title:"Давление в ТМ ниже 5 атм.", head:"Давление в магистрали ниже нормы — зарядка",
     text:"Давление в питаемой магистрали ниже настройки. Регулировочная пружина прогибает стальную мембрану вверх, и она открывает возбудительный клапан. Воздух из НМ идёт в правую камеру поршня, поршень смещается влево, и толкатель открывает питательный клапан: НМ заряжает питаемую магистраль.",
     pos:1, lift:1, arr:["arrSup","arrExc","arrHole"], vals:{Ptm:4.0,Pr:7.6,Pl:4.8}},
  B:{title:"Давление в ТМ достигло нормы.", head:"Давление достигло нормы — возбудительный клапан закрылся",
     text:"Давление в магистрали и над мембраной выросло, мембрана прогнулась вниз, и возбудительный клапан закрылся, отсекая НМ от правой камеры поршня. Через отверстие 0,5 мм воздух перетекает из правой камеры в левую, давление по обе стороны поршня выравнивается. Питательный клапан ещё открыт: пружина не успела вернуть поршень.",

  C:{title:"Давление в ТМ 5,0 атм (4,8–5,2).", head:"Норма 5,0 атм (допуск 4,8–5,2) — оба клапана закрыты",
     text:"Давление справа и слева от поршня одинаковое, пружина питательного клапана вернула поршень вправо, и клапан закрылся. Зарядка прекращена. Если давление в магистрали снова упадёт ниже настройки (расход, утечка), цикл повторится с первого режима. Через неплотность штока давление в левой камере поршня подтягивается к давлению магистрали, поэтому повторная зарядка возможна и при небольшом давлении в НМ.",

/* ---------- детали ---------- */
const PARTS = {
 1:["Стальная мембрана (возбудительный узел)","Чувствительный элемент. Сверху на неё давит воздух питаемой магистрали, снизу — регулировочная пружина. Если давление в магистрали ниже настройки, пружина прогибает мембрану вверх, и она через хвостовик открывает возбудительный клапан. Когда давление поднимается до настройки, мембрана прогибается вниз, и клапан закрывается."],

/* ---------- схема ---------- */
function spring(x1,y1,x2,y2,n,amp){
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
  let d=`M${x1.toFixed(1)} ${y1.toFixed(1)}`;
  for(let i=1;i<=n*2;i++){
    const t=(i-0.5)/(n*2), s=(i%2?1:-1)*amp;
    d+=` L${(x1+dx*t+nx*s).toFixed(1)} ${(y1+dy*t+ny*s).toFixed(1)}`;
  }
  return d+` L${x2.toFixed(1)} ${y2.toFixed(1)}`;
}
function draw(pos,lift,arrows,cone){
  const sh = 5*(1-pos), cn = cone===undefined ? lift : cone;      // cone — положение конуса возбудительного клапана (по умолчанию следует за мембраной)
  $('mov').setAttribute('transform',`translate(${sh} 0)`);
  $('chL').setAttribute('width',(104.5+sh)-96.5);
  $('chR').setAttribute('x',114.5+sh); $('chR').setAttribute('width',133.5-(114.5+sh));
  $('coneG').setAttribute('transform',`translate(0 ${5.5*(1-cn)})`);
  const yc = 242.5-3*lift;
  $('dia').setAttribute('d',`M155 242 Q215 ${2*yc-242} 275 242`);
  $('chJ').setAttribute('d',`M161 221H269.5V242Q215 ${2*yc-242} 161 242Z`);
  const t1=245-3*lift;
  $('spr1').setAttribute('d',spring(186,t1+1,247,250,6,2)); $('spr1b').setAttribute('d',spring(186,t1+1,247,250,6,2));
  $('spr2').setAttribute('d',spring(186,258.5,247,264.5,6,2)); $('spr2b').setAttribute('d',spring(186,258.5,247,264.5,6,2));
  $('holeLayer').setAttribute('transform',`translate(${sh} 0)`);
  bub.sh=sh;
}

/* ---------- пузырьки воздуха ----------
   Воздух идёт только через открытые отверстия: зазор питательного клапана, зазор возбудительного клапана и отверстие 0,5 мм в поршне.
   Скорость пузырьков постоянная и небольшая, сила потока меняется плавно; в учебных режимах A–C показаны стрелки исходного рисунка. */
const bub={items:[],tgt:{arrSup:0,arrExc:0,arrHole:0},cur:{arrSup:0,arrExc:0,arrHole:0},dir:{arrSup:1,arrExc:1,arrHole:1},wdir:{arrSup:1,arrExc:1,arrHole:1},sh:0,speed:15,fade:0.9,fixed:null};
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const sat=x=>x<=0?0:x>=1?1:x*(2-x);
function initBubbles(){
  const layer=$('bubbles');
  document.querySelectorAll('[data-g]').forEach((p,pi)=>{
    const len=p.getTotalLength(), n=Math.max(3,Math.round(len/10)), circles=[];
    for(let i=0;i<n;i++){
      const c=document.createElementNS(NS,'circle');
      c.setAttribute('r',(p.id==='holePath'?0.8:1.0+0.4*((i*7)%5)/4).toFixed(2));
      c.style.display='none'; layer.appendChild(c); circles.push(c);
    }
    bub.items.push({p,len,g:p.dataset.g,circles,n,hole:p.id==='holePath',ph:(pi*0.37)%1});
  });
}
function flowTargets(){
  const t=bub.tgt;
  if(bub.fixed){ for(const g in t) t[g]=bub.fixed.has(g)?1:0; bub.wdir.arrHole=1; return }
  if(guided&&STEPS[gi].noair){ t.arrSup=t.arrExc=t.arrHole=0; return }                     // исходное состояние: воздух ещё не пошёл   // режимы A–C: стрелки исходного рисунка
  t.arrSup=cl(G.pos,0,1)*sat((NM-G.Ptm)/2);                                                  // питательный клапан: зазор растёт с ходом поршня
  t.arrExc=cl(G.cone,0,1)*sat((NM-G.Pr)/1.0);                                                // возбудительный клапан: зазор между конусом и седлом
  t.arrHole=sat(Math.abs(G.Pr-G.Pl)/0.6); bub.wdir.arrHole=G.Pr>=G.Pl?1:-1;                  // отверстие 0,5 мм в поршне
}
function updateBubbles(dt){
  flowTargets();
  for(const g in bub.cur){
    let goal=bub.tgt[g];
    if(bub.wdir[g]!==bub.dir[g]){ goal=0; if(bub.cur[g]<0.02) bub.dir[g]=bub.wdir[g] }
    const st=bub.fade*dt; bub.cur[g]=cl(bub.cur[g]+cl(goal-bub.cur[g],-Math.abs(st),Math.abs(st)),0,1);
  }
  for(const it of bub.items){
    const k=bub.cur[it.g], dir=bub.dir[it.g];
    it.ph=(it.ph+dt*bub.speed*dir/it.len)%1; if(it.ph<0) it.ph+=1;
    for(let i=0;i<it.n;i++){
      const c=it.circles[i];
      if(k<0.03){ c.style.display='none'; continue }
      let s=(i/it.n+it.ph)%1; if(dir<0) s=1-s;
      const pt=it.p.getPointAtLength(s*it.len);
      c.setAttribute('cx',(pt.x+(it.hole?bub.sh:0)).toFixed(2)); c.setAttribute('cy',pt.y.toFixed(2));
      c.style.opacity=(Math.min(1,k*1.4)*Math.min(1,5*Math.min(s,1-s))).toFixed(2); c.style.display='';
    }
  }
}

/* ---------- давление в камерах: окраска и подсказка ---------- */
const CYAN=[0,255,255], RED=[255,0,0];
const REGCOL={nm:CYAN,pr:CYAN,tm:RED,pl:RED};
const mixc=(b,t)=>`rgb(${[0,1,2].map(i=>Math.round(255+(b[i]-255)*t)).join(',')})`;
const regEls=[...document.querySelectorAll('[data-reg]')];
let curP={nm:NM,tm:PSET,pr:PSET,pl:PSET}, approx=true;
function paint(v){
  const t=p=>v.shade?cl(p/PSET,0,1):1;           // в статичных режимах — цвета как на исходном рисунке
  curP={nm:NM,tm:v.Ptm,pr:v.Pr,pl:v.Pl}; approx=!v.shade;
  const tt={nm:1,tm:t(v.Ptm),pr:t(v.Pr),pl:t(v.Pl)};
  for(const el of regEls){
    const r=el.dataset.reg; if(r==='atm'||r==='gap') continue;
    const c=mixc(REGCOL[r],tt[r]);
    if(el.tagName==='polyline') el.style.stroke=c; else el.style.fill=c;
  }
  $('gap0').setAttribute('stop-color',mixc(CYAN,1)); $('gap1').setAttribute('stop-color',mixc(RED,tt.tm));
}
const tip=$('tip');
function showTip(el,x,y){

  else if(r==='atm'){ val='0 атм (атмосфера)'; sw='#fff' }
  else { val=(approx?'≈ ':'')+f2(curP[r])+' атм'; sw=el.style.fill||el.style.stroke||'#fff'; if(approx) note='значение для примера; живое давление — в режиме «Зарядка с нуля»' }
  tip.innerHTML=`<b>${el.dataset.name}</b><span class="v"><span class="sw" style="background:${sw}"></span>${val}</span>${note?`<small>${note}</small>`:''}`;
  tip.hidden=false;
  const w=tip.offsetWidth, h=tip.offsetHeight;
  tip.style.left=Math.min(x+14,innerWidth-w-8)+'px'; tip.style.top=(y+h+22>innerHeight?y-h-10:y+16)+'px';
}
const svgEl=$('scheme');
function tipMove(e){

svgEl.addEventListener('pointerleave',()=>{tip.hidden=true});

const EASE={lin:k=>k,out:k=>1-(1-k)*(1-k),io:k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2};
const ZERO={Ptm:0,Pr:0,Pl:0,pos:0,lift:1,cone:1};
/* в каждом шаге заметно движется одна деталь (или идёт только давление): lift — мембрана с пружинами, cone — конус возбудительного клапана, pos — поршень с толкателем и питательным клапаном */

let gi=0, gT=0, gFrom={...ZERO}, gAuto=false, gHold=0, guided=false;
const dotsEl=$('dots'); STEPS.forEach(()=>dotsEl.appendChild(document.createElement('i')));
function renderStepUI(){
  const s=STEPS[gi];
  $('stepNo').textContent=`Шаг ${gi+1} из ${STEPS.length}`;
  [...dotsEl.children].forEach((d,i)=>d.className=i<gi?'done':i===gi?'cur':'');
  $('mTitle').textContent=s.title; $('mText').textContent=s.text;

}
function enterStep(i,back){
  gi=i; gT=0; gHold=0;
  gFrom = i===0 ? {...ZERO} : back ? {...STEPS[i-1].to} : {...G};
  renderStepUI();
}
function updateGuided(dt){
  const s=STEPS[gi]; gT+=dt; const k=cl(gT/s.dur,0,1);
  for(const key in s.to){ const e=EASE[(s.ease&&s.ease[key])||'io'](k); G[key]=gFrom[key]+(s.to[key]-gFrom[key])*e }
  if(k>=1){
    if(gAuto){ gHold+=dt; if(gHold>2.8 && gi<STEPS.length-1) enterStep(gi+1); }
    if(gi===STEPS.length-1 && gAuto){ gAuto=false; $('sAuto').textContent='▶ Авто'; }
  }
  draw(G.pos,G.lift,k<1?s.g:[],G.cone);
  paint({Ptm:G.Ptm,Pr:G.Pr,Pl:G.Pl,shade:true});

}

/* ---------- цикл ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  updateBubbles(reduceMotion?0:dt);
  if(guided) updateGuided(dt);
  requestAnimationFrame(frame);
}

    const used=(g?g.offsetHeight+10:0)+(holder.offsetHeight?Math.max(holder.offsetHeight,70):0)+(parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom))+14;
    const avail=stage.clientHeight-used, availW=stage.clientWidth-(parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight));
    const w=Math.max(300,Math.min(availW,avail*r0));
    board.style.width=w+'px'; board.style.height=(w/r0)+'px';
  }
  function enter(){
    r0=ratio(); stage.classList.add('fsmode'); btn.textContent='✕ Выйти';
    body.appendChild(modes); holder.appendChild(explain); if(part) holder.appendChild(part);
    if(svg&&par==='none') svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    const p=stage.requestFullscreen&&stage.requestFullscreen(); if(p&&p.catch) p.catch(()=>{});   // если браузер не разрешил, остаётся режим «поверх страницы»
    fit(); setTimeout(fit,60); setTimeout(fit,300);
  }
  function leave(){
    stage.classList.remove('fsmode'); btn.textContent='⛶ На весь экран'; board.style.width=''; board.style.height='';
    colR.appendChild(modes); colR.appendChild(explain); if(part) colR.appendChild(part);
    if(svg&&par==='none') svg.setAttribute('preserveAspectRatio',par);
  }
  btn.addEventListener('click',e=>{ e.stopPropagation(); if(stage.classList.contains('fsmode')){ if(document.fullscreenElement) document.exitFullscreen(); else leave() } else enter() });
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&stage.classList.contains('fsmode')) leave(); else fit() });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&stage.classList.contains('fsmode')&&!document.fullscreenElement) leave() });
  addEventListener('resize',fit);
  new MutationObserver(fit).observe(holder,{childList:true,subtree:true,characterData:true});
})();
</script>
</body>
</html>
