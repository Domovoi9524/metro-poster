<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<link rel="icon" type="image/png" href="%%ICON%%">
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#1b2430; --muted:#5d6b7c; --line:#d5dce4;
  --accent:#1f6feb; --accent-ink:#ffffff; --hl:#ff8a00; --ok:#1a8a3c; --warn:#b26a00;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#12171d; --card:#1b222b; --ink:#e6ebf1; --muted:#9aa7b6; --line:#2f3a47; --accent:#4c8dff; --ok:#4cc46f; --warn:#e0a03a}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1600px;margin:0 auto;padding:16px}
a.back{color:var(--accent);text-decoration:none;font-size:14px;font-weight:600}
a.back:hover{text-decoration:underline}
h1{font-size:22px;margin:4px 0 0}
.sub{margin:2px 0 12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(330px,1fr);gap:14px;align-items:start;margin-bottom:12px}
.colL{position:sticky;top:12px}
.colR{display:flex;flex-direction:column}
@media (max-width:1000px){.layout{grid-template-columns:1fr}.colL{position:static}#explain{order:-1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.colL .card{margin-bottom:0}
.card h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.board{position:relative;background:#fff;border-radius:6px;overflow:hidden;aspect-ratio:1560/1064;width:min(100%,calc((100vh - 200px)*1560/1064));margin:0 auto;touch-action:manipulation}
@media (max-width:1000px){.board{width:100%}}
svg#scheme{display:block;width:100%;height:100%}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 11px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
.modes h2{font-size:12px;margin:10px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.modes h2:first-child{margin-top:0}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.row4 button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;font-weight:700;font-size:15px;padding:8px 9px}
.row4 button small{font-weight:400;color:var(--muted);font-size:11.5px;line-height:1.2}
.rkrow{display:flex;gap:8px;align-items:center}
.rkrow input{flex:1;min-width:0;accent-color:var(--accent)}
.rkrow button{padding:5px 11px}
.rkrow2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.rkrow2 b{font-size:15px;font-variant-numeric:tabular-nums}
.rkhint{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
#rkBox.off .rkrow,#rkBox.off .rkrow2 button{opacity:.45;pointer-events:none}
.row3 button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;font-weight:700;font-size:15px;padding:8px 10px}
.row3 button small{font-weight:400;color:var(--muted);font-size:12px;line-height:1.2}
.tog{display:grid;grid-template-columns:1fr;gap:6px}
.tog button{text-align:left;font-weight:600;font-size:13.5px;padding:8px 10px}
.modes button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.modes button.on small{color:#ffffffd0}
.speed{display:inline-flex}
.speed button{border-radius:0;margin-left:-1px;padding:6px 9px;font-size:13px}
.speed button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.speed button:last-child{border-radius:0 8px 8px 0}
.speed button.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rowx{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.rowx .lab{font-size:13px;color:var(--muted)}
#explain h3{margin:0 0 6px;font-size:18px}
#explain p{margin:0 0 8px}
#explain p.chain{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.5}
#explain b.k{color:var(--ink)}
[hidden]{display:none!important}
#partCard h3{margin:0 0 4px;font-size:16px}
#partCard p{margin:0;color:var(--muted)}
.gauges.chips{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:10px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip.on{border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
#tip{position:fixed;z-index:20;pointer-events:none;background:#101826;color:#fff;border:1px solid #ffffff40;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.35;box-shadow:0 4px 14px #0006;max-width:300px}
#tip b{display:block;font-size:13px}
#tip .v{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700}
#tip small{opacity:.75;display:block}
/* схема */
#hits rect{fill:#000;fill-opacity:0;cursor:pointer}
#hits rect:hover,#hits rect.hv{fill:#ff8a00;fill-opacity:.16;stroke:#ff8a00;stroke-width:1.4}
#hits rect.hl{fill:#ff8a00;fill-opacity:.22;stroke:#ff8a00;stroke-width:1.8}
.cu{fill:none;stroke:#ffb400;stroke-opacity:.5;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:stroke-opacity .5s}
.cu.off{stroke-opacity:0}
.dot{fill:#fff3b0;stroke:#b36b00;stroke-width:1.1;pointer-events:none}
.mk{pointer-events:none}
.mk.cl{fill:#25a850;stroke:#fff;stroke-width:1.6}
.mk.op{fill:#fff;stroke:#d12f2f;stroke-width:2}
.mk.rk.cl{fill:#2b7fff}
.rowhl{fill:#ffd24a;fill-opacity:.42;stroke:#e08a00;stroke-width:1.5;pointer-events:none}
.glow{fill:#ffb400;fill-opacity:0;stroke:#ff7a00;stroke-width:3;stroke-dasharray:9 6;pointer-events:none}
.glow.on{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{fill-opacity:.04;stroke-opacity:.35}50%{fill-opacity:.2;stroke-opacity:1}}
/* ---- полноэкранный режим (общий для всех приборов) ---- */
.fsbtn{position:absolute;top:8px;right:8px;z-index:5;padding:5px 10px;font-size:13px;font-weight:600;background:#fff;color:#1b2430;border:1px solid #b9c2cc;opacity:.85}
.fsbtn:hover{opacity:1}
#fsExplain:empty{display:none}
#fsPanel{display:none}
.fsmode{position:fixed!important;inset:0;z-index:100;margin:0!important;border:0!important;border-radius:0!important;display:flex!important;flex-direction:column;background:var(--bg);padding:8px 16px!important;overflow:hidden}
.fsmode .board{flex:none;margin:0 auto!important;max-width:none!important;aspect-ratio:auto!important}
.fsmode svg#scheme{max-height:none!important}
.fsmode #fsExplain{flex:none}
.fsmode #fsExplain .card{margin:8px 0 0;padding:8px 14px;max-height:170px;overflow:auto}
.fsmode #fsExplain h3{font-size:16px;margin:0 0 3px}
.fsmode #fsExplain p{font-size:14.5px;line-height:1.4}
.fsmode .gauges{margin-top:auto;padding-top:6px}
.fsmode .hint{display:none}
.fsmode #fsPanel{display:block;position:fixed;left:0;top:0;bottom:0;width:min(420px,92vw);transform:translateX(calc(-100% + 18px));transition:transform .18s ease;background:var(--card);border-right:1px solid var(--line);box-shadow:4px 0 18px #0005;z-index:110;overflow:hidden}
.fsmode #fsPanel:hover{transform:none;overflow:auto}
#fsTab{position:absolute;right:0;top:0;bottom:0;width:18px;writing-mode:vertical-rl;text-align:center;font-size:12px;font-weight:700;color:var(--muted);background:color-mix(in srgb,var(--accent) 18%,var(--card));display:flex;align-items:center;justify-content:center;letter-spacing:.06em}
.fsmode #fsPanel:hover #fsTab{display:none}
#fsBody{padding:12px 14px;margin-right:18px}
.fsmode #fsPanel:hover #fsBody{margin-right:0}
.fsmode .modes{margin-bottom:0}
#tip{z-index:300!important}
</style>
